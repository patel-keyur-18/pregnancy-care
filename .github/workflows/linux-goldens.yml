# Manual: regenerates the Linux golden screenshots on the same runner image
# CI uses, and uploads them as the `linux-goldens` artifact. Copy its files
# into test/goldens/linux/ after an intended visual change.
#   gh workflow run linux-goldens.yml --ref <branch>
name: Linux goldens

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test test/goldens --update-goldens

      - uses: actions/upload-artifact@v7
        with:
          name: linux-goldens
          path: test/goldens/linux/
          retention-days: 7
