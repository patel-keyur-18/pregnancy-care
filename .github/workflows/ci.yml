# ARCHITECTURE §16. No secrets: release APKs are debug-signed here and only
# signed with the real key on the owner's machine. iOS builds happen on the
# owner's Mac (free Apple ID signing can't run in CI).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: test/**/failures/
          retention-days: 7

      # After an intended visual change: download `linux-goldens` into
      # test/goldens/linux/ (this runner's renders are the Linux set).
      - name: Regenerate Linux goldens
        if: failure()
        run: flutter test test/goldens --update-goldens

      - name: Upload Linux goldens
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-goldens
          path: test/goldens/linux/
          retention-days: 7

      # The phone build: Arm only (~66 MB). Plan decision 25.
      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64

      # The owner's limit for the phone APK (Plan decision 14).
      - name: Check the phone APK is under 100 MB
        run: |
          size=$(stat -c%s build/app/outputs/flutter-apk/app-release.apk)
          echo "Phone APK: $size bytes"
          test "$size" -lt 100000000

      - uses: actions/upload-artifact@v7
        with:
          name: navmaas-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # A merge to main that bumps `version` in pubspec.yaml publishes a GitHub
  # release: tag v<version> with the phone APK. Already tagged: nothing to do.
  release:
    needs: check-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: navmaas-release-apk

      - name: Publish the release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml)
          test -n "$version"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          mv app-release.apk "navmaas-$version.apk"
          gh release create "v$version" "navmaas-$version.apk" \
            --target "$GITHUB_SHA" --title "Navmaas $version" --generate-notes
