name: navmaas
description: "Navmaas - a calm, private pregnancy companion."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.3

dependencies:
  audio_service: ^0.18.19
  cryptography: ^2.9.0
  drift: ^2.35.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  go_router: ^18.0.2
  health: ^13.3.2
  home_widget: ^0.10.0
  image_picker: ^1.2.3
  intl: any
  just_audio: ^0.10.6
  local_auth: ^3.0.2
  path: ^1.9.1
  path_parsing: ^1.1.0
  path_provider: ^2.1.6
  pdfrx: ^2.6.5
  record: ^7.1.1
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  sqlite3: ^3.7.0
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

# Encrypted database: package:sqlite3 bundles a SQLCipher build (replaces the
# end-of-life sqlcipher_flutter_libs). The binary is fetched and checksum-verified
# at build time only; the app itself makes no network calls.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/weeks.json
    - assets/content/care_template_in.json
    - assets/content/activities.json
    - assets/content/routines.json
    # Meditation's original bell and quiet clip (tool/bell.dart).
    - assets/audio/bell.wav
    - assets/audio/quiet.wav
  # Bundled (OFL, see assets/fonts/OFL-*.txt). No runtime font download (ADR-008).
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Variable.ttf
